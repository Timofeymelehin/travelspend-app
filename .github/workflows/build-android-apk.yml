name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Android Platform
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/TravelSpend-update.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: travelspend-apk
          path: release-output/TravelSpend-update.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Release v1.1.0' }}
          body: |
            ## 🚀 Новое обновление TravelSpend
            - Автоматическая сборка APK для встроенного авто-апдейтера
            - Оптимизация таблицы трат под мобильные экраны
            - Чистый верхний тулбар с заголовком поездки
            - Поддержка фонового автообновления
          draft: false
          prerelease: false
          files: release-output/TravelSpend-update.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

